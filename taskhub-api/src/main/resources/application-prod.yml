# Production: every secret and connection setting comes from the environment. A missing
# value fails startup instead of falling back to a default.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

taskhub:
  security:
    jwt:
      secret: ${JWT_SECRET:}  # validated: required, >= 256 bits (JwtProperties)
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
