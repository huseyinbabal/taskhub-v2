# Local development dependencies. Spring Boot's Docker Compose support starts these
# automatically when taskhub-api runs with the `dev` profile (SPEC §Commands).
# Credentials below are for local development only.
services:
  postgres:
    image: 'postgres:17-alpine'
    environment:
      - 'POSTGRES_DB=taskhub'
      - 'POSTGRES_USER=taskhub'
      - 'POSTGRES_PASSWORD=taskhub'
    ports:
      - '5432'
